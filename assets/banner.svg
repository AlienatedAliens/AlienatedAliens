<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="82%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="18%" cy="88%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glowCyan)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glowGold)"/>
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Column: Identity & Focus -->
  <g transform="translate(52, 46)">
    <rect x="0" y="0" width="294" height="28" rx="14" fill="#0c2438" stroke="#0284c7" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#34d399"/>
    <text x="28" y="18.5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600" fill="#7dd3fc" letter-spacing="1.1">MELBOURNE, AU · ROLL SOLO</text>

    <text x="0" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#f8fafc" letter-spacing="-0.8">Sean Maxwell</text>

    <text x="0" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1">
      <tspan x="0" dy="0">Cryptographic provenance gates, zero-VRAM agent verification,</tspan>
      <tspan x="0" dy="26">and deterministic simulation systems.</tspan>
    </text>

    <!-- Bottom capability pills -->
    <g transform="translate(0, 166)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">
      <rect x="0" y="0" width="196" height="34" rx="8" fill="#111c33" stroke="#334155"/>
      <text x="14" y="21.5" fill="#38bdf8" font-weight="600">Ed25519 + RFC 6962</text>

      <rect x="208" y="0" width="206" height="34" rx="8" fill="#111c33" stroke="#334155"/>
      <text x="222" y="21.5" fill="#34d399" font-weight="600">OpenVINO INT8 (0 VRAM)</text>

      <rect x="426" y="0" width="214" height="34" rx="8" fill="#111c33" stroke="#334155"/>
      <text x="440" y="21.5" fill="#fbbf24" font-weight="600">Neurosymbolic + Z3 SMT</text>
    </g>
  </g>

  <!-- Right Column: Clean Architecture Stack Card -->
  <g transform="translate(792, 36)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <rect x="0" y="0" width="358" height="228" rx="12" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"/>
    <circle cx="20" cy="20" r="4.5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="35" cy="20" r="4.5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="50" cy="20" r="4.5" fill="#10b981" fill-opacity="0.8"/>
    <text x="70" y="24" font-size="11.5" fill="#64748b">runtime_boundary.verify()</text>
    <line x1="0" y1="38" x2="358" y2="38" stroke="#1e293b" stroke-width="1"/>

    <rect x="18" y="52" width="322" height="44" rx="7" fill="#0f1b31" stroke="#1e3a5f"/>
    <text x="30" y="71" font-size="12" font-weight="700" fill="#38bdf8">1. MCP WIRE PROXY</text>
    <text x="30" y="87" font-size="11" fill="#94a3b8">Ed25519 · Merkle · AER-1 · Lost-Resp</text>

    <rect x="18" y="108" width="322" height="44" rx="7" fill="#0e2224" stroke="#115e59"/>
    <text x="30" y="127" font-size="12" font-weight="700" fill="#34d399">2. POST-TURN SUPERVISOR</text>
    <text x="30" y="143" font-size="11" fill="#94a3b8">82.7 MB INT8 · 17.9 ms CPU p50 · 0 VRAM</text>

    <rect x="18" y="164" width="322" height="44" rx="7" fill="#1f1912" stroke="#78350f"/>
    <text x="30" y="183" font-size="12" font-weight="700" fill="#fbbf24">3. PROVENANCE GATE</text>
    <text x="30" y="199" font-size="11" fill="#94a3b8">SQLite Triggers · Shingle RAG Dedup</text>
  </g>
</svg>
